<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百家4.0 · 牌靴審核檢視</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/review-logo.png">
  <link rel="icon" type="image/png" sizes="128x128" href="assets/review-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@200;400;500;700&display=swap" rel="stylesheet">
  
  <!-- 賭場綠金風格核心樣式 (依據《賭場綠金風格.md》) -->
  <link rel="stylesheet" href="casino-theme.css?v=2">
  <link rel="stylesheet" href="integrated.css?v=14">
  <link rel="stylesheet" href="integrated-dashboard.css?v=45">
  <link rel="stylesheet" href="shoe-overview.css?v=7">
  <link rel="stylesheet" href="standard/import_feedback.css?v=5">
  <link rel="stylesheet" href="standard/point_matrix.css?v=5">
  <link rel="stylesheet" href="review.css?v=16">
</head>
<body class="dashboard review-page" data-mode="standard" data-sub="red0" data-density="normal">

  <!-- ═══════════ 頂部標題與核心動作 ═══════════ -->
  <header class="review-header">
    <div class="review-branding">
      <div class="crest" title="百家4.0"></div>
      <h1 class="review-title">SHOE MASTER<small>百家4.0 · 牌靴審核檢視</small></h1>
    </div>

    <div class="review-header-actions">
      <!-- 匯入 (本機 / 雲端) -->
      <button class="tool-btn" id="btnImport" type="button" title="開啟外部 Excel 牌靴檔案">匯入</button>
      <input type="file" id="importFileInput" accept=".xlsx" style="display:none">

      <button class="tool-btn" id="btnSaveReview" type="button" title="保存目前牌局，下次開啟自動還原">保存牌局</button>
      <span id="reviewSaveStatus" role="status" aria-live="polite"></span>

      <!-- 導出檔名與導出按鈕 -->
      <label id="exportFilenameField" class="export-filename-field" title="僅存本機；尾碼自動接續，編號保存在本機">
        導出檔名
        <input id="exportFilename" type="text" maxlength="155" autocomplete="off" spellcheck="false" placeholder="留白：F 自動編號">
      </label>
      <button class="tool-btn" id="btnExportCombined" type="button" title="將目前牌靴導出為 Excel">導出</button>

      <!-- 舊腳本的按鈕插槽：頁內收合總覽保留，注入的頁首按鈕會移除。 -->
      <button class="tool-btn" id="btnTableWindow" type="button" style="display:none;" aria-hidden="true"></button>

      <!-- 牌靴狀態 -->
      <div class="shoe-state">
        <span class="dot"></span>
        <span class="st-idle">待命 STANDBY</span>
        <span class="st-run">處理中</span>
        <span id="shoeRoundTotal" style="color:var(--gold-2)">SHOE · 0 局</span>
      </div>
    </div>
  </header>

  <div class="review-workspace">
    <aside class="review-sidebar">
  <!-- ═══════════ 操作工具列 (換牌 / 換局 / 切牌 / 定位) ═══════════ -->
  <nav class="review-toolbar gframe" aria-label="理牌與切牌工具列">
    <span class="frame-title">理牌與切牌工具</span>

    <!-- 理牌編輯操作 -->
    <div class="review-tool-group">
      <span class="review-tool-label">理牌編輯:</span>
      <button class="tool-btn" id="btnSwap" disabled type="button" title="點選兩張牌進行交換">換牌</button>
      <button class="tool-btn" id="btnRound" disabled type="button" title="點選兩局進行整局對調">換局</button>
      <label class="swap-preview-toggle" title="換牌時先預覽對調結果" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--gold-2);cursor:pointer;">
        <input type="checkbox" id="toggleSwapPreview" style="accent-color:#d9b568;"><span>換牌預覽</span>
      </label>
      <button class="tool-btn" id="btnAutoColor" disabled type="button" title="同牌面調換紅藍背顏色">換色</button>
      <button class="tool-btn" id="btnApplyChanges" disabled type="button" title="儲存編輯後的牌序">套用編輯</button>
      <button class="tool-btn" id="btnCancelEdit" disabled type="button" title="取消目前選取狀態">取消</button>
    </div>

    <div class="review-tool-sep"></div>

    <!-- 切牌與定位操作 -->
    <div class="review-tool-group">
      <span class="review-tool-label">切牌定位:</span>
      <div class="review-input-group" title="輸入切牌張數直接執行；0 恢復載入或套用編輯時的牌序">
        <span>切牌:</span>
        <input class="review-numbox" type="number" inputmode="numeric" id="cutPos" min="0" placeholder="張數">
        <button class="tool-btn" id="btnCut" type="button">執行</button>
      </div>
      <button class="tool-btn" id="btnResetOrder" type="button" title="把牌序還原成載入或套用編輯時的原始順序（丟棄切牌、換局、換牌）">重置</button>
      <div class="review-input-group" title="輸入 1~416 的全靴張號進行高亮定位">
        <span>定位:</span>
        <input class="review-numbox" type="number" inputmode="numeric" id="highlightCardPos" min="1" placeholder="第幾張">
        <button class="tool-btn" id="btnHighlightCard" type="button">高亮</button>
      </div>
    </div>

    <div class="review-tool-sep"></div>

    <!-- 檢視輔助 -->
    <div class="review-tool-group">
      <button class="tool-btn" id="btnPointMatrix" type="button">點數機率</button>
    </div>
    <div class="review-tool-group">
      <button class="tool-btn" id="btnApplyTools" type="button" title="開啟百家樂點數計算與補牌助手">計算工具</button>
    </div>
  </nav>
    </aside>
    <div class="review-content">

    <!-- 違規檢查狀態卡片 (紅0規則判定，完全參照主頁 5 項標準) -->
    <details class="violations gframe status-card vio-live-card" id="statsVioCard" aria-label="違規項目">
      <summary class="review-vio-summary">紅0／四梅花規則審核</summary>
      <div class="violations-grid" id="violationsGrid">
        <div class="vio violation-card no-violation"><div class="lamp">●</div><span class="v-name">訊號牌違規</span><span class="v-val violation-detail" id="signalViolationDetail">無</span></div>
        <div class="vio violation-card no-violation"><div class="lamp">●</div><span class="v-name">連5局4張</span><span class="v-val violation-detail" id="fourCardViolationDetail">無</span></div>
        <div class="vio violation-card no-violation"><div class="lamp">●</div><span class="v-name">連莊閒</span><span class="v-val violation-detail" id="streakViolationDetail">無</span></div>
        <div class="vio violation-card no-violation"><div class="lamp">●</div><span class="v-name">無法對調</span><span class="v-val violation-detail" id="cannotSwapViolationDetail">無</span></div>
        <div class="vio violation-card no-violation"><div class="lamp">●</div><span class="v-name">其他違規</span><span class="v-val violation-detail" id="otherViolationDetail">無</span></div>
      </div>
      <div class="vio-empty" id="vioEmpty">目前無違規</div>
    </details>

  <!-- 牌靴總覽：沿用 shoe-overview.js 的報表內容，頁內收合。 -->
  <main>
    <details class="review-overview-card gframe" id="reviewOverview">
      <summary>牌靴總覽</summary>
      <div class="review-overview-heading" id="reviewOverviewHeading"></div>
      <div id="reviewOverviewContent"></div>
    </details>
  </main>

  <!-- ═══════════ 牌桌主表格（BACCARAT SHOE RECORD） ═══════════ -->
  <section class="pit review-felt-container">
    <div class="felt">
      <div class="felt-head">
        <span class="rule"></span>
        <span class="arc-text">BACCARAT · SHOE REVIEW &amp; EDIT</span>
        <span class="rule"></span>
      </div>

      <!-- 尚未匯入時的空狀態提示 -->
      <div id="reviewEmptyState" class="review-empty-state">
        <strong>尚未載入牌靴資料</strong>
        請點擊右上角「匯入」按鈕開啟本機或雲端 Excel 牌靴檔案進行審核檢視與編輯。
      </div>

      <div class="table-scroll">
        <table id="roundsTable" class="split-rounds" style="display:none">
          <colgroup>
            <col style="width:4%">   <!-- 局 -->
            <col style="width:23%">  <!-- 卡牌 -->
            <col style="width:14%">  <!-- 卡色 -->
            <col style="width:7%">   <!-- 終 -->
            <col style="width:15%">  <!-- 閒家牌 -->
            <col style="width:15%">  <!-- 莊家牌 -->
            <col style="width:7%">   <!-- 閒 -->
            <col style="width:7%">   <!-- 莊 -->
            <col style="width:8%">   <!-- 調 -->
          </colgroup>
          <thead id="roundsHead"></thead>
          <tbody id="roundsBody"></tbody>
        </table>
        <div class="tbl-empty" id="tblEmpty" style="display:none;"></div>
      </div>
    </div>
  </section>

  <!-- ═══════════ 操作紀錄 LOG ═══════════ -->
  <section class="logbox gframe closed" style="margin-top:14px;">
    <div class="log-head" id="logHead" onclick="this.closest('.logbox').classList.toggle('closed')">
      <span class="frame-title">操作紀錄 LOG</span>
      <span class="log-count" id="logCount">0 則</span>
      <span class="caret">▼</span>
    </div>
    <div class="log-body" id="logArea"></div>
  </section>
    </div>
  </div>

  <!-- ═══════════ 相容層（提供內部腳本所需之錨點與預設值） ═══════════ -->
  <div class="compat-hidden" id="compatLayer" aria-hidden="true" style="display:none;">
    <span id="modeStatus">紅0模式</span>
    <input type="checkbox" id="tripleTieRule" checked>
    <input type="checkbox" id="mixedCardColor">
    <button id="clearBtn"></button>
    <div id="tvProgress"></div>
    <span id="sharedCardCounts"></span>
    <span id="recoveryImmediateDetail">--</span>
    <span id="recoveryRange1to5">--</span>
    <span id="recoveryRange6to10">--</span>
    <span id="recoveryRange11to15">--</span>
    <span id="recoveryRange16plus">--</span>
    <span id="recoveryAvgDetail">--</span>
    <span id="recoveryMaxDetail">--</span>
    <span id="recoveryAvg">--</span>
    <span id="recoveryAvgCards">--</span>
    <div id="recoveryDisplay"></div>
  </div>

  <!-- ═══════════ JavaScript 元件庫載入 ═══════════ -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="standard/point_matrix.js?v=6"></script>
  <script src="standard/import_feedback.js?v=2"></script>
  <script src="card_color_rules.js?v=3"></script>
  <script src="tie_spread.js?v=5"></script>
  <script src="standard/round_size_limits.js?v=1"></script>
  <script src="standard/player_seven_limits.js?v=1"></script>
  <script src="standard/two_thirteen_reversals.js?v=6"></script>
  <script src="standard/export_filename.js?v=3"></script>
  <script src="standard/target_roadmap.js?v=2"></script>
  <script src="standard/red0_balance.js?v=1"></script>
  <script src="standard/recovery_search.js?v=2"></script>
  <script src="standard/signals.js?v=68"></script>
  <script src="standard/generation_budget.js?v=2"></script>
  <script src="standard/shoe_cut.js?v=3"></script>
  <script src="standard/signals_ui.js?v=59"></script>
  <script src="standard/smart_reorder_dialog.js?v=2"></script>
  <script src="standard/swap_preview.js?v=4"></script>
  <script src="standard/auto_fix_plugin.js?v=4"></script>
  <script src="traverse_quota.js?v=2"></script>
  <script src="traverse_templates.js?v=8"></script>
  <script src="traverse_tail_fill.js?v=6"></script>
  <script src="traverse_red0_balance.js?v=5"></script>
  <script src="traverse_a2_tail.js?v=4"></script>
  <script src="traverse_builder.js?v=64"></script>
  <script src="traverse_export.js?v=8"></script>
  <script src="traverse_limits.js?v=5"></script>
  <script src="traverse_optimizer.js?v=11"></script>
  <script src="integrated-analysis.js?v=1"></script>

  <!-- 審核檢視專屬適配層 -->
  <script src="review-tie-rules.js?v=1"></script>
  <script src="review.js?v=7"></script>

  <!-- 牌靴總覽視窗 -->
  <script src="shoe-overview.js?v=7"></script>
  <script src="review-default-shoe.js?v=1"></script>
  <script src="review-storage.js?v=4"></script>
</body>
</html>
