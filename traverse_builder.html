<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿越排牌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #f0e9d6;
  --bg-paper: #faf6e8;
  --bg-sunken: #e3dcc4;
  --border-subtle: #d8cfb1;
  --border-default: #b8a980;
  --border-strong: #6b5a32;
  --text-primary: #221c0e;
  --text-secondary: #5a5036;
  --text-tertiary: #8a7d5c;
  --accent: #b8842a;
  --accent-bg: #f7e6b8;
  --accent-strong: #7a5418;
  --banker: #d6362a;
  --banker-bg: #fad7d2;
  --player: #2660b3;
  --player-bg: #cfdef2;
  --tie: #2e8a4a;
  --bg-cream: #fff8e3;
  --ink: #221c0e;
  --duizhuang: #7d3aa5;
  --b6win: #d4661c;
  --row-h: 36px;
  --font-sans: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
  --font-display: 'Noto Serif TC', serif;
  --font-mono: 'Roboto Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
}
.app { display: flex; flex-direction: column; height: 100vh; padding: 12px 16px; gap: 12px; }
.topbar {
  display: flex; flex-direction: column; align-items: stretch; gap: 8px;
  background: var(--bg-paper); border: 2px solid var(--border-strong); border-radius: 10px; padding: 10px 16px;
}
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, max-content) minmax(400px, 1fr); gap: 12px; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.card {
  background: var(--bg-paper);
  border: 2px solid var(--border-strong);
  border-radius: 10px;
  padding: 12px 14px;
  display: flex; flex-direction: column; min-height: 0;
}
.card h2 { font-family: var(--font-display); font-size: 16px; margin: 0 0 10px; flex: none; }
.card.grow { flex: 1; }
.scroll { flex: 1; min-height: 0; overflow: auto; }
.fields { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; }
.field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.field input {
  width: 90px; padding: 6px 8px;
  border: 1.5px solid var(--border-default); border-radius: 6px;
  background: #fff; font-family: var(--font-mono); font-size: 14px;
}
.btn {
  padding: 8px 18px; border-radius: 6px; cursor: pointer;
  border: 2px solid var(--border-strong); background: var(--accent-bg);
  color: var(--accent-strong); font-weight: 700; font-size: 14px;
}
.btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.fields.actions { align-items: center; }
.field-inline { display: inline-flex; align-items: center; gap: 6px; }
.field-inline label { margin: 0; }
.sep { width: 1.5px; align-self: stretch; background: var(--border-subtle); margin: 0 4px; }
.toggle { display: inline-flex; align-items: center; user-select: none; background: var(--bg-paper); color: var(--text-tertiary); }
.toggle input { display: none; }
.toggle:has(input:checked) { background: var(--accent); color: #fff; }
.btn.stop { background: var(--banker-bg); color: var(--banker); border-color: var(--banker); }
#progress { flex: 1; min-width: 200px; text-align: right; font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); min-height: 18px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.vio-total { font-family: var(--font-mono); font-size: 14px; color: var(--banker); }
.vio-total.clean { color: var(--tie); }
.vio-group { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-bottom: 6px; }
.vio-group .k { font-weight: 700; color: var(--text-secondary); min-width: 96px; }
.vio-link {
  font-family: var(--font-mono); font-size: 13px; color: var(--banker); cursor: pointer;
  border: 1px solid var(--banker); border-radius: 4px; padding: 0 6px; background: var(--banker-bg);
}
.vio-link:hover { background: var(--banker); color: #fff; }
.round-table tbody tr.violation-row { background: rgba(180,50,40,0.18) !important; }
.round-table tbody tr.flash { outline: 3px solid var(--accent); outline-offset: -3px; }
.round-table.swap-mode .card-label { cursor: pointer; }
.round-table.swap-mode .card-label:hover { border-color: var(--accent); }
/* 百家3.0：color #ff3b3b + 粗體；這裡是米色底，改用同色系較深的牌桌紅確保看得清楚 */
.card-label.s-signal-card { color: var(--banker); font-weight: 700; }
.card-label.selected-first  { background: rgba(46,138,74,0.18); border: 3px solid #2e8a4a; color: #2e8a4a; }
.card-label.selected-second { background: rgba(212,160,30,0.22); border: 3px solid #b8842a; color: #8a5e0e; }
.btn.active { background: var(--accent); color: #fff; }
.bpt { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-bottom: 10px; }
.bpt:empty { display: none; }
.bpt-item { display: inline-flex; align-items: center; gap: 6px; }
.bpt-num { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }
.bpt-pct { font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); }
.bpt-total { color: var(--text-secondary); margin-left: auto; }
.stat { background: var(--bg-sunken); border-radius: 8px; padding: 10px 12px; }
.stat .k { font-size: 12px; color: var(--text-secondary); }
.stat .v { font-family: var(--font-mono); font-size: 18px; font-weight: 700; margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { border-bottom: 1px solid var(--border-subtle); padding: 6px 8px; text-align: center; }
th { color: var(--text-secondary); font-weight: 600; }
.ok { color: var(--tie); font-weight: 700; }
.ng { color: var(--banker); font-weight: 700; }
.table-scroll { overflow-x: auto; }
.empty { color: var(--text-tertiary); }

/* ===== 一局一局牌表（樣式沿用主頁 index.html 的 .round-table） ===== */
.round-table { width: auto; table-layout: fixed; border-collapse: collapse; font-size: 22px; }
.round-table th:nth-child(1), .round-table td:nth-child(1) { width: 25px; }
.round-table th:nth-child(2), .round-table td:nth-child(2) { width: 300px; }
.round-table th:nth-child(3), .round-table td:nth-child(3) { width: 80px; }
.round-table th:nth-child(4), .round-table td:nth-child(4) { width: 140px; }
.round-table th:nth-child(5), .round-table td:nth-child(5) { width: 140px; }
.round-table th:nth-child(6), .round-table td:nth-child(6) { width: 40px; color: var(--player); }
.round-table th:nth-child(7), .round-table td:nth-child(7) { width: 40px; color: var(--banker); }
.round-table th:nth-child(8), .round-table td:nth-child(8) { width: 82px; text-align: center; }
.round-table thead th {
  background: var(--bg-cream); text-align: center; font-weight: 700; font-size: 15px;
  letter-spacing: 0.1em; color: var(--text-secondary); padding: 3px 24px;
  border-bottom: 1.5px solid var(--ink); font-family: var(--font-display); white-space: nowrap;
  position: sticky; top: 0; z-index: 2;
}
.round-table tbody tr { background: var(--bg-paper); border-bottom: 1px solid var(--border-subtle); }
.round-table tbody tr:nth-child(even) { background: var(--bg-cream); }
.round-table tbody tr:hover { background: var(--accent-bg); }
.round-table tbody tr.traverse-round { background: rgba(125,58,165,0.06); }
.round-table tbody tr.traverse-round td:last-child { border-right: 2px solid var(--duizhuang); }
.round-table td { padding: 4px 7px; vertical-align: middle; height: var(--row-h); text-align: left; }
.round-table td.minor-column, .round-table td.hand-point-cell { text-align: center; font-family: var(--font-mono); font-weight: 700; }
.round-table td.result-cell { text-align: center; vertical-align: middle; }
.round-table tr.group-row td {
  background: var(--bg-sunken); font-family: var(--font-display); font-size: 14px; font-weight: 700;
  color: var(--text-secondary); padding: 6px 10px; height: auto;
}
.card-strip, .hand-chip-strip { display: inline-flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.card-label {
  display: inline-flex; align-items: center; justify-content: center;
  height: 38px; min-width: 38px; border-radius: 3px;
  background: var(--bg-paper); border: 1.5px solid var(--ink);
  font-family: var(--font-mono); font-size: 20px; font-weight: 400; color: #6b5e45; white-space: nowrap;
}
.outcome {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 4px; font-weight: 800; font-size: 20px;
  font-family: var(--font-display); border: 1.5px solid var(--ink); box-shadow: 1px 1px 0 var(--ink);
}
.outcome-banker { background: var(--banker); color: white; }
.outcome-player { background: var(--player); color: white; }
.outcome-tie { background: var(--tie); color: white; }
.row-tag {
  display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 12px;
  font-size: 12px; font-weight: 700; border: 1.5px solid var(--ink); font-family: var(--font-mono);
}
.tag-warn-red { background: var(--banker); color: white; }
#chainTable thead th { position: sticky; top: 0; background: var(--bg-paper); }
/* 窄螢幕：改成上下排列，牌表仍在最前面 */
@media (max-width: 1100px) {
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .card.grow { max-height: 80vh; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <!-- 第一排：排牌參數與規則 -->
    <div class="fields">
      <div class="field"><label for="idleLimit">撿不到停</label><input id="idleLimit" type="number" min="10" value="1000"></div>
      <div class="field"><label for="computeTries">補排次數</label><input id="computeTries" type="number" min="0" value="20000"></div>
      <div class="field"><label for="chainAttempts">接段次數</label><input id="chainAttempts" type="number" min="1" value="20"></div>
      <div class="field"><label for="maxLeftover" title="空白＝不重跑">剩幾張重跑</label><input id="maxLeftover" type="number" min="0" max="416" value="5"></div>
      <span class="sep"></span>
      <label class="btn toggle"><input id="tripleTie" type="checkbox" checked>三條</label>
      <label class="btn toggle"><input id="signalRule" type="checkbox" checked>A.2</label>
      <label class="btn toggle"><input id="strongMode" type="checkbox">強</label>
    </div>
    <!-- 第二排：操作與進度 -->
    <div class="fields actions">
      <button id="btnRun" class="btn">開始排牌</button>
      <button id="btnStop" class="btn stop" disabled>停止</button>
      <span class="sep"></span>
      <div class="field field-inline"><label for="cutPos">切牌張數</label><input id="cutPos" type="number" min="0" max="415" value="0" disabled title="0＝原序"></div>
      <button id="btnCut" class="btn" disabled>切牌</button>
      <button id="btnSwap" class="btn" disabled>換牌</button>
      <span class="sep"></span>
      <button id="btnExport" class="btn" disabled>導出</button>
      <div id="progress"></div>
    </div>
  </header>

  <div class="main">
    <section class="card grow">
      <h2>牌表</h2>
      <div class="scroll">
        <table class="round-table" id="roundsTable">
          <thead><tr><th>局</th><th>卡牌</th><th>結</th><th>閒家</th><th>莊家</th><th>閒</th><th>莊</th><th>調</th></tr></thead>
          <tbody id="roundsBody"><tr><td colspan="8" class="empty">尚未排牌，按上方「開始排牌」</td></tr></tbody>
        </table>
      </div>
    </section>

    <aside class="side">
      <section class="card">
        <h2>結果</h2>
        <div id="bpt" class="bpt"></div>
        <div id="stats" class="stats"><div class="empty">尚未排牌</div></div>
      </section>
      <section class="card">
        <h2>違規 <span id="vioTotal" class="vio-total"></span></h2>
        <div id="violations"><div class="empty">尚未排牌</div></div>
      </section>
      <section class="card grow">
        <h2>長段驗證</h2>
        <div class="scroll"><table id="chainTable"><thead><tr>
          <th>#</th><th>起始</th><th>張</th><th>局</th><th>穿越</th><th>敏感</th><th>對調後</th>
        </tr></thead><tbody><tr><td colspan="7" class="empty">尚未排牌</td></tr></tbody></table></div>
      </section>
    </aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="traverse_builder.js?v=6"></script>
<script src="traverse_export.js?v=3"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let cancelled = false;
  let lastResult = null;

  const num = (id) => parseInt($(id).value, 10);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // 牌面文字沿用主表格：10 顯示成 T，點數在前、花色在後
  const cardText = (c) => `${c.rank === '10' ? 'T' : c.rank}${c.suit}`;
  // 訊號牌（A、2）亮紅字，跟百家3.0 的 .s-signal-card 一樣
  const sigCls = (c) => (c.point === 1 || c.point === 2) ? ' s-signal-card' : '';
  const label = (c) => `<span class="card-label${sigCls(c)}">${esc(cardText(c))}</span>`;

  const outcomeClass = { '莊': 'banker', '閒': 'player', '和': 'tie' };
  const badge = (r) => `<span class="outcome outcome-${outcomeClass[r]}">${r}</span>`;

  let baseCards = null;   // 排牌結果（未切牌）
  let cutPos = 0;
  let shownRounds = [];   // 目前牌表上的局（切牌後重新發）

  // 違規判定：無法對調，或對調前兩張後莊→莊、閒→閒（和→和可以）
  function violationOf(round) {
    if (!round.hand) return null;
    const sw = TraverseExport.swappedTotals(round);
    if (!sw || sw.size !== round.hand.size) return 'noSwap';
    if (sw.result === round.hand.result && sw.result !== '和') return 'same';
    return null;
  }

  function roundRow(round, no) {
    // 卡牌欄的牌帶上「目前牌表的第幾張」，換牌時用
    const cardsHtml = `<span class="card-strip">${round.cards.map((c, k) =>
      `<span class="card-label${sigCls(c)}" data-p="${round.start + k}">${esc(cardText(c))}</span>`).join('')}</span>`;
    if (!round.hand) {
      // 殘牌：不足一局
      return `<tr id="round-${no}"><td class="minor-column">${no}</td><td>${cardsHtml}</td><td class="result-cell"></td><td></td><td></td><td></td><td></td><td>殘牌</td></tr>`;
    }
    const d = round.hand;
    const sw = TraverseExport.swappedTotals(round);
    let swapCell;
    if (!sw || sw.size !== d.size) swapCell = '<span class="row-tag tag-warn-red">無法對調</span>';
    else swapCell = badge(sw.result);
    const at = (i) => round.cards[i - round.start];
    const cls = [round.segment === 'A' ? 'traverse-round' : '', violationOf(round) ? 'violation-row' : ''].filter(Boolean).join(' ');
    return `<tr id="round-${no}"${cls ? ` class="${cls}"` : ''}>
      <td class="minor-column">${no}</td>
      <td>${cardsHtml}</td>
      <td class="result-cell">${badge(d.result)}</td>
      <td><span class="hand-chip-strip">${d.P.map((i) => label(at(i))).join('')}</span></td>
      <td><span class="hand-chip-strip">${d.B.map((i) => label(at(i))).join('')}</span></td>
      <td class="hand-point-cell">${d.pp}</td>
      <td class="hand-point-cell">${d.bb}</td>
      <td>${swapCell}</td></tr>`;
  }

  function renderTable(result) {
    shownRounds = TraverseExport.dealRounds(TraverseExport.cutDeck(baseCards, cutPos));
    const parts = [];
    if (cutPos === 0) {
      // 原序：依長段分組（長段邊界一定落在局的起點）
      const groupAt = new Map();
      result.chains.forEach((c, i) => groupAt.set(c.start - 1, `長段 ${i + 1}｜第 ${c.start}～${c.start + c.length - 1} 張｜${c.length} 張 ${c.rounds} 局`));
      if (result.leftoverCount) groupAt.set(416 - result.leftoverCount, `排不進去的牌｜第 ${417 - result.leftoverCount}～416 張｜${result.leftoverCount} 張`);
      shownRounds.forEach((r, i) => {
        if (groupAt.has(r.start)) parts.push(`<tr class="group-row"><td colspan="8">${groupAt.get(r.start)}</td></tr>`);
        parts.push(roundRow(r, i + 1));
      });
    } else {
      const done = shownRounds.filter((r) => r.hand).length;
      parts.push(`<tr class="group-row"><td colspan="8">切牌 ${cutPos} 張｜從原本第 ${cutPos + 1} 張開始發｜共 ${done} 局｜紫色列＝整局都是穿越段的牌</td></tr>`);
      shownRounds.forEach((r, i) => parts.push(roundRow(r, i + 1)));
    }
    $('roundsBody').innerHTML = parts.join('');
    renderBpt();
    renderViolations();
    updateSwapHighlights();
  }

  // 三條規則違規：上一局是三條卻沒開和，或上一局不是三條卻開和（標在開和／該和的那一局）
  function tripleViolations() {
    const out = [];
    if (!$('tripleTie').checked) return out;
    for (let k = 0; k + 1 < shownRounds.length; k++) {
      const a = shownRounds[k], b = shownRounds[k + 1];
      if (!a.hand || !b.hand) continue;
      const trip = TraverseBuilder.isTriple(a.cards.map((c) => c.point));
      if (trip !== (b.result === '和')) out.push(k + 2);
    }
    return out;
  }

  // 訊號牌規則違規：上一局（非三條）有 A、2 這局卻不是莊，或沒有 A、2 這局卻是莊
  function signalViolations() {
    const out = [];
    if (!$('signalRule').checked) return out;
    for (let k = 0; k + 1 < shownRounds.length; k++) {
      const a = shownRounds[k], b = shownRounds[k + 1];
      if (!a.hand || !b.hand) continue;
      const pts = a.cards.map((c) => c.point);
      if ($('tripleTie').checked && TraverseBuilder.isTriple(pts)) continue; // 歸三條規則
      const need = TraverseBuilder.isSignalHand(pts) ? '莊' : '閒';
      if (b.result !== '和' && b.result !== need) out.push(k + 2);
      else if (b.result === '和' && !$('tripleTie').checked) out.push(k + 2);
    }
    return out;
  }

  function renderViolations() {
    const groups = { noSwap: [], same: [], triple: tripleViolations(), signal: signalViolations() };
    shownRounds.forEach((r, i) => { const v = violationOf(r); if (v) groups[v].push(i + 1); });
    const vioRounds = new Set([...groups.noSwap, ...groups.same, ...groups.triple, ...groups.signal]);
    document.querySelectorAll('#roundsBody tr[id^="round-"]').forEach((tr) => {
      tr.classList.toggle('violation-row', vioRounds.has(Number(tr.id.slice(6))));
    });
    const total = vioRounds.size;
    $('vioTotal').textContent = total ? `${total} 局` : '無';
    $('vioTotal').classList.toggle('clean', !total);
    if (!total) {
      $('violations').innerHTML = '<div class="empty">沒有違規</div>';
      return;
    }
    const line = (name, list) => list.length
      ? `<div class="vio-group"><span class="k">${name}（${list.length}）</span>${list.map((n) => `<a class="vio-link" data-goto="${n}">第${n}局</a>`).join('')}</div>`
      : '';
    $('violations').innerHTML = line('無法對調', groups.noSwap) + line('對調後結果不變', groups.same)
      + line('三條規則', groups.triple) + line('訊號牌規則', groups.signal);
  }

  // 點違規連結：捲到那一局並閃一下
  $('violations').addEventListener('click', (e) => {
    const a = e.target.closest('[data-goto]');
    if (!a) return;
    const row = $(`round-${a.dataset.goto}`);
    if (!row) return;
    row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 1600);
  });

  // ===== 換牌：按「換牌」進入模式 → 點兩張牌 → 再按一次「換牌」交換 =====
  const swapState = { on: false, first: null, second: null };

  function updateSwapHighlights() {
    $('roundsTable').classList.toggle('swap-mode', swapState.on);
    $('btnSwap').classList.toggle('active', swapState.on);
    $('btnSwap').textContent = swapState.on ? (swapState.first !== null && swapState.second !== null ? '確定交換' : '取消換牌') : '換牌';
    document.querySelectorAll('#roundsBody .card-label[data-p]').forEach((el) => {
      const p = Number(el.dataset.p);
      el.classList.toggle('selected-first', p === swapState.first);
      el.classList.toggle('selected-second', p === swapState.second);
    });
  }

  $('roundsBody').addEventListener('click', (e) => {
    if (!swapState.on) return;
    const el = e.target.closest('.card-label[data-p]');
    if (!el) return;
    const p = Number(el.dataset.p);
    if (swapState.first === p) swapState.first = null;
    else if (swapState.second === p) swapState.second = null;
    else if (swapState.first === null) swapState.first = p;
    else swapState.second = p;
    updateSwapHighlights();
    $('progress').textContent = swapState.first !== null && swapState.second !== null
      ? '已選兩張，按「確定交換」' : '換牌：請點選兩張牌';
  });

  // 換牌後重算每條長段是否仍合格
  function refreshChainChecks() {
    const pts = baseCards.map((c) => c.point);
    lastResult.chains.forEach((c) => {
      const seg = pts.slice(c.start - 1, c.start - 1 + c.length);
      const rounds = TraverseBuilder.roundsFromStart(seg);
      c.traverse = TraverseBuilder.isTraverse(seg);
      c.allSensitive = !!rounds && rounds.every((r) => TraverseBuilder.handSensitive(seg.slice(r.start, r.start + r.size)));
      c.qualified = TraverseBuilder.qualifies(seg);
      c.rounds = rounds ? rounds.length : 0;
    });
  }

  $('btnSwap').addEventListener('click', () => {
    if (!swapState.on) {
      swapState.on = true;
      swapState.first = swapState.second = null;
      updateSwapHighlights();
      $('progress').textContent = '換牌：請點選兩張牌';
      return;
    }
    if (swapState.first === null || swapState.second === null) {
      swapState.on = false;
      swapState.first = swapState.second = null;
      updateSwapHighlights();
      $('progress').textContent = '已取消換牌';
      return;
    }
    // 牌表上的位置換回未切牌的位置
    const a = (swapState.first + cutPos) % 416;
    const b = (swapState.second + cutPos) % 416;
    const ca = baseCards[a], cb = baseCards[b];
    // 穿越段標記跟著位置走，不跟著牌走
    const fa = ca.traverse, fb = cb.traverse;
    [baseCards[a], baseCards[b]] = [cb, ca];
    baseCards[a].traverse = fa;
    baseCards[b].traverse = fb;
    const scroller = $('roundsTable').parentElement;
    const top = scroller.scrollTop;
    swapState.first = swapState.second = null;
    refreshChainChecks();
    render(lastResult);
    scroller.scrollTop = top;
    $('progress').textContent = `已交換 ${cardText(ca)} 與 ${cardText(cb)}（原序第 ${a + 1} 張 ↔ 第 ${b + 1} 張）`;
  });

  // 莊閒和統計：跟著目前牌表（切牌後會重算）
  function renderBpt() {
    const n = { '莊': 0, '閒': 0, '和': 0 };
    shownRounds.forEach((r) => { if (r.hand) n[r.result]++; });
    const total = n['莊'] + n['閒'] + n['和'];
    const pct = (k) => (total ? ((k / total) * 100).toFixed(1) : '0.0');
    $('bpt').innerHTML = [['莊', 'banker'], ['閒', 'player'], ['和', 'tie']].map(([k, cls]) => `
      <div class="bpt-item"><span class="outcome outcome-${cls}">${k}</span>
      <span class="bpt-num">${n[k]}</span><span class="bpt-pct">${pct(n[k])}%</span></div>`).join('')
      + `<div class="bpt-item bpt-total">共 <span class="bpt-num">${total}</span> 局</div>`;
  }

  function render(result) {
    const s = result.stats;
    const longest = result.chains.length ? result.chains[0].length : 0;
    const allOk = result.chains.every((c) => c.qualified);
    $('stats').innerHTML = [
      ['排進穿越段', `${416 - result.leftoverCount} 張`],
      ['剩下排不進去', `${result.leftoverCount} 張`],
      ['長段數', result.chains.length],
      ['最長一段', `${longest} 張`],
      ['洗牌次數', s.shuffles],
      ['計算補排段數', s.phase2Segments],
      ['全部驗證', allOk ? '通過' : '有問題'],
      ['總耗時（含重跑）', `${((result.totalMs ?? s.ms) / 1000).toFixed(1)} 秒`],
      ['重跑次數', result.reruns || 0],
      ['訊號牌對調局數', result.signal ? result.signal.flips : '未開啟'],
    ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

    const mark = (b) => (b ? '<span class="ok">✓</span>' : '<span class="ng">✗</span>');
    $('chainTable').querySelector('tbody').innerHTML = result.chains.map((c, i) => `
      <tr><td>${i + 1}</td><td>${c.start}</td><td>${c.length}</td><td>${c.rounds}</td>
      <td>${mark(c.traverse)}</td><td>${mark(c.allSensitive)}</td><td>${mark(c.qualified)}</td></tr>`).join('')
      || '<tr><td colspan="7" class="empty">沒有排出任何段</td></tr>';

    renderTable(result);
  }

  // 雲端：沿用百家3.0 的 Apps Script，但存到另一個資料夾「穿越牌」
  const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypt3_PnEL5TgdDPaBwg1M5bWAjQMR9dD5Jslicn3eZCtuNSTtqO35RafhQpuX-l9_m/exec';
  const DRIVE_FOLDER_ID = '17RvOVNDc0a_JEem1SnRPsTEvm8otkJdx';
  // 「百家樂語音」Apps Script 的 doPost 已支援 folderId（2026-10-07）；關掉就只下載不上傳
  const CLOUD_UPLOAD_ENABLED = true;

  // 導出檔名：TR 開頭獨立編號，與百家3.0 的 F 編號分開
  const EXPORT_PREFIX = 'TR';
  async function fetchFolderFiles() {
    let lastError = null;
    for (let attempt = 1; attempt <= 4; attempt++) {
      try {
        const res = await fetch(`${GOOGLE_APPS_SCRIPT_URL}?folderId=${DRIVE_FOLDER_ID}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data && data.success && Array.isArray(data.files)) return data.files;
        throw new Error((data && data.error) || '檔案清單格式錯誤');
      } catch (e) {
        lastError = e;
        if (attempt < 4) await new Promise((r) => setTimeout(r, 2000 * attempt));
      }
    }
    throw new Error(`讀取雲端「穿越牌」清單失敗：${lastError && lastError.message}`);
  }

  async function nextExportFilename() {
    const files = await fetchFolderFiles();
    const re = new RegExp(`^${EXPORT_PREFIX}(\\d+)\\.xlsx$`, 'i');
    let max = 0;
    files.forEach((f) => { const m = (f.name || '').match(re); if (m) max = Math.max(max, parseInt(m[1], 10)); });
    return `${EXPORT_PREFIX}${String(max + 1).padStart(3, '0')}.xlsx`;
  }

  async function uploadToDrive(blob, filename) {
    const buf = new Uint8Array(await blob.arrayBuffer());
    let bin = '';
    for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    const body = JSON.stringify({ filename, base64Data: btoa(bin), folderId: DRIVE_FOLDER_ID });
    const countSame = async () => (await fetchFolderFiles()).filter((f) => f.name === filename).length;
    const before = await countSame();
    let lastError = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        // 上一次可能已寫進雲端、只是回應出錯；先確認，避免重複上傳
        if (attempt > 1 && (await countSame()) > before) return;
        const res = await fetch(GOOGLE_APPS_SCRIPT_URL, { method: 'POST', body });
        const data = await res.json();
        if (data && data.success) return;
        throw new Error((data && data.error) || '上傳失敗');
      } catch (e) {
        lastError = e;
        if (attempt < 3) await new Promise((r) => setTimeout(r, 2000 * attempt));
      }
    }
    throw lastError;
  }

  async function exportExcel() {
    if (!shownRounds.length) return;
    $('btnExport').disabled = true;
    try {
      const blob = await TraverseExport.buildWorkbook(shownRounds);
      $('progress').textContent = '讀取雲端編號…';
      const filename = await nextExportFilename();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      const which = cutPos ? `切牌 ${cutPos} 張後` : '原序';
      if (CLOUD_UPLOAD_ENABLED) {
        $('progress').textContent = `已下載 ${filename}，正在上傳雲端「穿越牌」…`;
        try {
          await uploadToDrive(blob, filename);
          $('progress').textContent = `已導出 ${filename}（${which}），本機與雲端「穿越牌」都已存好`;
        } catch (e) {
          $('progress').textContent = `已下載 ${filename}（${which}），但上傳雲端失敗：${e.message || e}`;
        }
      } else {
        $('progress').textContent = `已下載 ${filename}（${which}），雲端上傳尚未開啟`;
      }
    } catch (e) {
      console.error(e);
      $('progress').textContent = `導出失敗：${e.message || e}`;
    } finally {
      $('btnExport').disabled = false;
    }
  }

  function setReady(ready) {
    ['cutPos', 'btnCut', 'btnSwap', 'btnExport'].forEach((id) => { $(id).disabled = !ready; });
  }

  $('btnRun').addEventListener('click', async () => {
    cancelled = false;
    swapState.on = false;
    swapState.first = swapState.second = null;
    $('btnRun').disabled = true;
    $('btnStop').disabled = false;
    setReady(false);
    $('progress').textContent = '開始排牌…';
    try {
      // 空白＝不重跑；0＝一張都不能剩
      const rawLimit = $('maxLeftover').value.trim();
      const maxLeftover = rawLimit === '' ? null : Math.max(0, parseInt(rawLimit, 10) || 0);
      const t0 = Date.now();
      let reruns = 0;
      for (;;) {
        const tag = reruns ? `［重跑第 ${reruns} 次］` : '';
        lastResult = await TraverseBuilder.build({
          idleLimit: num('idleLimit'),
          computeTries: num('computeTries'),
          chainAttempts: num('chainAttempts'),
          tripleTie: $('tripleTie').checked,
          signalRule: $('signalRule').checked,
          strong: $('strongMode').checked,
          onProgress: (m) => { $('progress').textContent = tag + m; },
          isCancelled: () => cancelled,
        });
        // 排不進的張數超過設定、或訊號牌對調後穿越段不合格，就整副重跑；按停止則保留目前這次
        // 強條件合格段極少，重跑也排不滿，只跑一次讓人看結果
        if (cancelled || $('strongMode').checked) break;
        const tooMany = maxLeftover !== null && lastResult.leftoverCount > maxLeftover;
        const signalBad = lastResult.signal && !lastResult.signal.ok;
        if (!tooMany && !signalBad) break;
        reruns++;
        $('progress').textContent = tooMany
          ? `剩 ${lastResult.leftoverCount} 張排不進去，超過 ${maxLeftover} 張，重跑第 ${reruns} 次…`
          : `訊號牌對調後有長段不合格，重跑第 ${reruns} 次…`;
      }
      lastResult.reruns = reruns;
      lastResult.totalMs = Date.now() - t0;
      // 標記穿越段的牌，切牌後仍能辨認
      baseCards = lastResult.cards.map((c) => ({ ...c, traverse: false }));
      lastResult.chains.forEach((ch) => {
        for (let k = ch.start - 1; k < ch.start - 1 + ch.length; k++) baseCards[k].traverse = true;
      });
      cutPos = 0;
      $('cutPos').value = 0;
      render(lastResult);
      $('progress').textContent = cancelled ? '已停止，顯示目前為止的結果'
        : ($('strongMode').checked ? `完成（強條件，只跑一次）：撿到 ${lastResult.chains.length} 段，排進 ${416 - lastResult.leftoverCount} 張` : '完成');
      setReady(true);
    } catch (e) {
      console.error(e);
      $('progress').textContent = `排牌失敗：${e.message || e}`;
    } finally {
      $('btnRun').disabled = false;
      $('btnStop').disabled = true;
    }
  });
  $('btnStop').addEventListener('click', () => { cancelled = true; });
  $('btnCut').addEventListener('click', () => {
    const v = parseInt($('cutPos').value, 10);
    if (!Number.isInteger(v) || v < 0 || v > 415) {
      $('progress').textContent = '切牌張數要在 0～415 之間';
      return;
    }
    cutPos = v;
    renderTable(lastResult);
    $('progress').textContent = v ? `已切牌 ${v} 張，從原本第 ${v + 1} 張開始發` : '已恢復原序';
  });
  $('btnExport').addEventListener('click', exportExcel);
})();
</script>
</body>
</html>
