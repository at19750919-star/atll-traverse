<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿越排牌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-base: #f0e9d6;
  --bg-paper: #faf6e8;
  --bg-sunken: #e3dcc4;
  --border-subtle: #d8cfb1;
  --border-default: #b8a980;
  --border-strong: #6b5a32;
  --text-primary: #221c0e;
  --text-secondary: #5a5036;
  --text-tertiary: #8a7d5c;
  --accent: #b8842a;
  --accent-bg: #f7e6b8;
  --accent-strong: #7a5418;
  --banker: #d6362a;
  --banker-bg: #fad7d2;
  --player: #2660b3;
  --player-bg: #cfdef2;
  --tie: #2e8a4a;
  --bg-cream: #fff8e3;
  --ink: #221c0e;
  --duizhuang: #7d3aa5;
  --b6win: #d4661c;
  --row-h: 36px;
  --font-sans: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
  --font-display: 'Noto Serif TC', serif;
  --font-mono: 'Roboto Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-family: var(--font-display); font-size: 26px; margin: 0 0 4px; }
.sub { color: var(--text-secondary); margin: 0 0 20px; line-height: 1.6; }
.card {
  background: var(--bg-paper);
  border: 2px solid var(--border-strong);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}
.card h2 { font-family: var(--font-display); font-size: 17px; margin: 0 0 12px; }
.fields { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
.field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.field input {
  width: 110px; padding: 6px 8px;
  border: 1.5px solid var(--border-default); border-radius: 6px;
  background: #fff; font-family: var(--font-mono); font-size: 14px;
}
.btn {
  padding: 8px 18px; border-radius: 6px; cursor: pointer;
  border: 2px solid var(--border-strong); background: var(--accent-bg);
  color: var(--accent-strong); font-weight: 700; font-size: 14px;
}
.btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.stop { background: var(--banker-bg); color: var(--banker); border-color: var(--banker); }
#progress { margin-top: 12px; font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); min-height: 18px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { background: var(--bg-sunken); border-radius: 8px; padding: 10px 12px; }
.stat .k { font-size: 12px; color: var(--text-secondary); }
.stat .v { font-family: var(--font-mono); font-size: 20px; font-weight: 700; margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { border-bottom: 1px solid var(--border-subtle); padding: 6px 8px; text-align: center; }
th { color: var(--text-secondary); font-weight: 600; }
.ok { color: var(--tie); font-weight: 700; }
.ng { color: var(--banker); font-weight: 700; }
.table-scroll { overflow-x: auto; }
.empty { color: var(--text-tertiary); }

/* ===== 一局一局牌表（樣式沿用主頁 index.html 的 .round-table） ===== */
.table-container { overflow-x: auto; }
.round-table { width: auto; table-layout: fixed; border-collapse: collapse; font-size: 22px; }
.round-table th:nth-child(1), .round-table td:nth-child(1) { width: 25px; }
.round-table th:nth-child(2), .round-table td:nth-child(2) { width: 300px; }
.round-table th:nth-child(3), .round-table td:nth-child(3) { width: 80px; }
.round-table th:nth-child(4), .round-table td:nth-child(4) { width: 140px; }
.round-table th:nth-child(5), .round-table td:nth-child(5) { width: 140px; }
.round-table th:nth-child(6), .round-table td:nth-child(6) { width: 40px; color: var(--player); }
.round-table th:nth-child(7), .round-table td:nth-child(7) { width: 40px; color: var(--banker); }
.round-table th:nth-child(8), .round-table td:nth-child(8) { width: 82px; text-align: center; }
.round-table thead th {
  background: var(--bg-cream); text-align: center; font-weight: 700; font-size: 15px;
  letter-spacing: 0.1em; color: var(--text-secondary); padding: 3px 24px;
  border-bottom: 1.5px solid var(--ink); font-family: var(--font-display); white-space: nowrap;
  position: sticky; top: 0; z-index: 2;
}
.round-table tbody tr { background: var(--bg-paper); border-bottom: 1px solid var(--border-subtle); }
.round-table tbody tr:nth-child(even) { background: var(--bg-cream); }
.round-table tbody tr:hover { background: var(--accent-bg); }
.round-table tbody tr.traverse-round { background: rgba(125,58,165,0.06); }
.round-table tbody tr.traverse-round td:last-child { border-right: 2px solid var(--duizhuang); }
.round-table td { padding: 4px 7px; vertical-align: middle; height: var(--row-h); text-align: left; }
.round-table td.minor-column, .round-table td.hand-point-cell { text-align: center; font-family: var(--font-mono); font-weight: 700; }
.round-table td.result-cell { text-align: center; vertical-align: middle; }
.round-table td.banker-six-point { color: var(--b6win) !important; font-weight: 700; }
.round-table tr.group-row td {
  background: var(--bg-sunken); font-family: var(--font-display); font-size: 14px; font-weight: 700;
  color: var(--text-secondary); padding: 6px 10px; height: auto;
}
.card-strip, .hand-chip-strip { display: inline-flex; gap: 3px; flex-wrap: wrap; align-items: center; }
.card-label {
  display: inline-flex; align-items: center; justify-content: center;
  height: 38px; min-width: 38px; border-radius: 3px;
  background: var(--bg-paper); border: 1.5px solid var(--ink);
  font-family: var(--font-mono); font-size: 20px; font-weight: 400; color: #6b5e45; white-space: nowrap;
}
.outcome {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 4px; font-weight: 800; font-size: 20px;
  font-family: var(--font-display); border: 1.5px solid var(--ink); box-shadow: 1px 1px 0 var(--ink);
}
.outcome-banker { background: var(--banker); color: white; }
.outcome-player { background: var(--player); color: white; }
.outcome-tie { background: var(--tie); color: white; }
.row-tag {
  display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 12px;
  font-size: 12px; font-weight: 700; border: 1.5px solid var(--ink); font-family: var(--font-mono);
}
.tag-warn-amber { background: var(--b6win); color: white; }
.tag-warn-purple { background: var(--duizhuang); color: white; }
.tag-warn-red { background: var(--banker); color: white; }
@media (max-width: 600px) {
  .field input { width: 90px; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1>穿越排牌</h1>
  <p class="sub">
    把 416 張牌反覆洗牌，撿出合格的穿越段（每局敏感、任一局對調後仍穿越），剩下的再用計算方式補排，最後把段接成長段。<br>
    只看點數，不檢查卡色與訊號牌。撿不進去的牌放在整條牌最後面。
  </p>

  <div class="card">
    <h2>設定</h2>
    <div class="fields">
      <div class="field"><label for="idleLimit">連續撿不到幾次停止</label><input id="idleLimit" type="number" min="10" value="1000"></div>
      <div class="field"><label for="computeTries">計算補排嘗試次數</label><input id="computeTries" type="number" min="0" value="20000"></div>
      <div class="field"><label for="chainAttempts">接段嘗試次數</label><input id="chainAttempts" type="number" min="1" value="20"></div>
      <div class="field"><label for="minLen">每段最少張數</label><input id="minLen" type="number" min="8" max="20" value="8"></div>
      <div class="field"><label for="maxLen">每段最多張數</label><input id="maxLen" type="number" min="8" max="20" value="12"></div>
      <button id="btnRun" class="btn">開始排牌</button>
      <button id="btnStop" class="btn stop" disabled>停止</button>
      <button id="btnCsv" class="btn" disabled>下載牌序 CSV</button>
    </div>
    <div id="progress"></div>
  </div>

  <div class="card">
    <h2>結果</h2>
    <div id="stats" class="stats"><div class="empty">尚未排牌</div></div>
  </div>

  <div class="card">
    <h2>長段驗證</h2>
    <div class="table-scroll"><table id="chainTable"><thead><tr>
      <th>#</th><th>起始張</th><th>張數</th><th>局數</th><th>穿越</th><th>每局敏感</th><th>對調後仍穿越</th>
    </tr></thead><tbody><tr><td colspan="7" class="empty">尚未排牌</td></tr></tbody></table></div>
  </div>

  <div class="card">
    <h2>牌表</h2>
    <div class="table-container">
      <table class="round-table" id="roundsTable">
        <thead><tr><th>局</th><th>卡牌</th><th>結</th><th>閒家</th><th>莊家</th><th>閒</th><th>莊</th><th>調</th></tr></thead>
        <tbody id="roundsBody"><tr><td colspan="8" class="empty">尚未排牌</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="traverse_builder.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let cancelled = false;
  let lastResult = null;

  const num = (id) => parseInt($(id).value, 10);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // 牌面文字沿用主表格：10 顯示成 T，點數在前、花色在後
  const cardText = (c) => `${c.rank === '10' ? 'T' : c.rank}${c.suit}`;
  const label = (c) => `<span class="card-label">${esc(cardText(c))}</span>`;

  // 一局的閒/莊分牌（與 TraverseBuilder.simulateHand 同一套補牌規則）
  function dealDetail(points, start, limit) {
    if (start + 4 > limit) return null;
    const P = [start, start + 2];
    const Bk = [start + 1, start + 3];
    let pp = (points[start] + points[start + 2]) % 10;
    let bb = (points[start + 1] + points[start + 3]) % 10;
    if (pp < 8 && bb < 8) {
      if (pp <= 5) {
        if (start + 5 > limit) return null;
        const p3 = points[start + 4];
        P.push(start + 4);
        pp = (pp + p3) % 10;
        let bd;
        if (bb <= 2) bd = true;
        else if (bb === 3) bd = p3 !== 8;
        else if (bb === 4) bd = p3 >= 2 && p3 <= 7;
        else if (bb === 5) bd = p3 >= 4 && p3 <= 7;
        else if (bb === 6) bd = p3 === 6 || p3 === 7;
        else bd = false;
        if (bd) {
          if (start + 6 > limit) return null;
          Bk.push(start + 5);
          bb = (bb + points[start + 5]) % 10;
        }
      } else if (bb <= 5) {
        if (start + 5 > limit) return null;
        Bk.push(start + 4);
        bb = (bb + points[start + 4]) % 10;
      }
    }
    const result = pp > bb ? '閒' : (bb > pp ? '莊' : '和');
    return { P, B: Bk, pp, bb, result, size: P.length + Bk.length };
  }

  const outcomeClass = { '莊': 'banker', '閒': 'player', '和': 'tie' };
  const badge = (r) => `<span class="outcome outcome-${outcomeClass[r]}">${r}</span>`;

  // 把 [from, to) 的牌一局一局轉成表格列，roundNo 為起始局號
  function rowsFor(cards, from, to, roundNo, isTraverse) {
    const points = cards.map((c) => c.point);
    const rows = [];
    let cur = from;
    while (cur < to) {
      const d = dealDetail(points, cur, to);
      if (!d) {
        // 殘牌：不足一局
        const rest = cards.slice(cur, to);
        rows.push(`<tr><td class="minor-column">${roundNo++}</td><td><span class="card-strip">${rest.map(label).join('')}</span></td><td class="result-cell"></td><td></td><td></td><td></td><td></td><td>--</td></tr>`);
        break;
      }
      const swapped = points.slice();
      [swapped[cur], swapped[cur + 1]] = [swapped[cur + 1], swapped[cur]];
      const sw = dealDetail(swapped, cur, cur + d.size);
      let swapCell;
      if (!sw || sw.size !== d.size) swapCell = '<span class="row-tag tag-warn-red">無法對調</span>';
      else if (d.result === '莊' && d.bb === 6 && d.pp <= 5) swapCell = '<span class="row-tag tag-warn-amber">莊6贏</span>';
      else if (sw.result === '莊' && sw.bb === 6) swapCell = '<span class="row-tag tag-warn-purple">對調莊6</span>';
      else swapCell = badge(sw.result);
      const roundCards = cards.slice(cur, cur + d.size);
      rows.push(`<tr${isTraverse ? ' class="traverse-round"' : ''}>
        <td class="minor-column">${roundNo++}</td>
        <td><span class="card-strip">${roundCards.map(label).join('')}</span></td>
        <td class="result-cell">${badge(d.result)}</td>
        <td><span class="hand-chip-strip">${d.P.map((i) => label(cards[i])).join('')}</span></td>
        <td><span class="hand-chip-strip">${d.B.map((i) => label(cards[i])).join('')}</span></td>
        <td class="hand-point-cell">${d.pp}</td>
        <td class="hand-point-cell${d.bb === 6 ? ' banker-six-point' : ''}">${d.bb}</td>
        <td>${swapCell}</td></tr>`);
      cur += d.size;
    }
    return { rows, roundNo };
  }

  function render(result) {
    const s = result.stats;
    const longest = result.chains.length ? result.chains[0].length : 0;
    const allOk = result.chains.every((c) => c.qualified);
    $('stats').innerHTML = [
      ['排進穿越段', `${416 - result.leftoverCount} 張`],
      ['剩下排不進去', `${result.leftoverCount} 張`],
      ['長段數', result.chains.length],
      ['最長一段', `${longest} 張`],
      ['洗牌次數', s.shuffles],
      ['計算補排段數', s.phase2Segments],
      ['全部驗證', allOk ? '通過' : '有問題'],
      ['耗時', `${(s.ms / 1000).toFixed(1)} 秒`],
    ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');

    const mark = (b) => (b ? '<span class="ok">✓</span>' : '<span class="ng">✗</span>');
    $('chainTable').querySelector('tbody').innerHTML = result.chains.map((c, i) => `
      <tr><td>${i + 1}</td><td>${c.start}</td><td>${c.length}</td><td>${c.rounds}</td>
      <td>${mark(c.traverse)}</td><td>${mark(c.allSensitive)}</td><td>${mark(c.qualified)}</td></tr>`).join('')
      || '<tr><td colspan="7" class="empty">沒有排出任何段</td></tr>';

    const parts = [];
    let roundNo = 1;
    result.chains.forEach((c, i) => {
      parts.push(`<tr class="group-row"><td colspan="8">長段 ${i + 1}｜第 ${c.start}～${c.start + c.length - 1} 張｜${c.length} 張 ${c.rounds} 局</td></tr>`);
      const out = rowsFor(result.cards, c.start - 1, c.start - 1 + c.length, roundNo, true);
      parts.push(...out.rows);
      roundNo = out.roundNo;
    });
    if (result.leftoverCount) {
      parts.push(`<tr class="group-row"><td colspan="8">排不進去的牌｜第 ${417 - result.leftoverCount}～416 張｜${result.leftoverCount} 張</td></tr>`);
      parts.push(...rowsFor(result.cards, 416 - result.leftoverCount, 416, roundNo, false).rows);
    }
    $('roundsBody').innerHTML = parts.join('');
  }

  function downloadCsv(result) {
    const segOf = new Array(416).fill('剩餘');
    result.chains.forEach((c, i) => { for (let k = 0; k < c.length; k++) segOf[c.start - 1 + k] = `長段${i + 1}`; });
    const lines = ['序號,花色,點數牌,點數,所屬段'];
    result.cards.forEach((c, i) => lines.push(`${i + 1},${c.suit},${c.rank},${c.point},${segOf[i]}`));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `穿越排牌_${new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '')}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  }

  $('btnRun').addEventListener('click', async () => {
    const minLen = num('minLen');
    const maxLen = num('maxLen');
    if (!(minLen >= 8 && maxLen >= minLen)) {
      $('progress').textContent = '每段張數設定不正確：最少要 ≥ 8，最多要 ≥ 最少';
      return;
    }
    cancelled = false;
    $('btnRun').disabled = true;
    $('btnStop').disabled = false;
    $('btnCsv').disabled = true;
    $('progress').textContent = '開始排牌…';
    try {
      lastResult = await TraverseBuilder.build({
        idleLimit: num('idleLimit'),
        computeTries: num('computeTries'),
        chainAttempts: num('chainAttempts'),
        minLen, maxLen,
        onProgress: (m) => { $('progress').textContent = m; },
        isCancelled: () => cancelled,
      });
      render(lastResult);
      $('progress').textContent = cancelled ? '已停止，顯示目前為止的結果' : '完成';
      $('btnCsv').disabled = false;
    } catch (e) {
      console.error(e);
      $('progress').textContent = `排牌失敗：${e.message || e}`;
    } finally {
      $('btnRun').disabled = false;
      $('btnStop').disabled = true;
    }
  });
  $('btnStop').addEventListener('click', () => { cancelled = true; });
  $('btnCsv').addEventListener('click', () => { if (lastResult) downloadCsv(lastResult); });
})();
</script>
</body>
</html>
